<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoBak</title>
<style>
/* ── Тема ────────────────────────────────────────────────────────────── */
:root {
  --bg: #0f1115;
  --panel: #16191f;
  --panel-2: #1c2028;
  --line: #262b35;
  --text: #e6e9ef;
  --muted: #8b93a3;
  --accent: #4c8dff;
  --accent-dim: #2b4f8f;
  --ok: #3ecf8e;
  --warn: #f0b429;
  --danger: #f2545b;
  --radius: 8px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe3ea;
    --text: #1a1d24; --muted: #6b7383; --accent: #2563eb; --accent-dim: #bfd3fb;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13.5px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── Каркас ──────────────────────────────────────────────────────────── */
#app { flex: 1; display: flex; min-height: 0; }

#sidebar {
  width: 252px; flex: none; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
}
#brand {
  padding: 14px 16px 12px; font-weight: 650; letter-spacing: .3px;
  display: flex; align-items: baseline; gap: 8px;
}
#brand .v { font-size: 11px; color: var(--muted); font-weight: 400; }
.side-head {
  padding: 10px 16px 6px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .8px; color: var(--muted); display: flex;
  justify-content: space-between; align-items: center;
}
.side-head button {
  background: none; border: none; color: var(--muted); padding: 2px 6px;
  border-radius: 5px; font-size: 15px; line-height: 1;
}
.side-head button:hover { background: var(--panel-2); color: var(--text); }
#servers { overflow-y: auto; flex: 1; padding: 0 8px; }
.srv {
  display: flex; align-items: center; gap: 9px; padding: 8px 9px;
  border-radius: var(--radius); margin-bottom: 2px; border: 1px solid transparent;
}
.srv:hover { background: var(--panel-2); }
.srv.sel { background: var(--panel-2); border-color: var(--line); }
.srv .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.srv .dot.ok { background: var(--ok); }
.srv .dot.warn { background: var(--warn); }
.srv .dot.err { background: var(--danger); }
.srv .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srv .t { font-size: 11px; color: var(--muted); flex: none; }
#side-foot { padding: 8px; border-top: 1px solid var(--line); }
.side-btn {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 7px 9px; border-radius: var(--radius); color: var(--muted);
}
.side-btn:hover { background: var(--panel-2); color: var(--text); }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#head {
  padding: 14px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; flex: none;
}
#head h1 { margin: 0; font-size: 17px; font-weight: 600; }
#head .sub { color: var(--muted); font-size: 12px; }
#head .spacer { flex: 1; }
.badge {
  font-size: 11px; padding: 2px 7px; border-radius: 20px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
}
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.badge.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

#tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.tab {
  background: none; border: none; padding: 9px 13px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.sel { color: var(--text); border-bottom-color: var(--accent); }

#view { flex: 1; overflow-y: auto; padding: 18px 20px 24px; min-height: 0; }

/* ── Элементы ────────────────────────────────────────────────────────── */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.card h2 .hint { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.stat .v { font-size: 19px; font-weight: 600; margin-top: 2px; }
.stat .v.sm { font-size: 14px; font-weight: 500; }

.btn {
  background: var(--panel-2); border: 1px solid var(--line); padding: 6px 13px;
  border-radius: var(--radius); color: var(--text);
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn.danger { border-color: color-mix(in srgb, var(--danger) 50%, transparent); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line);
}
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--panel-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
/* Диалоги выбора файла и открытие каталога в проводнике существуют
   только в оконной версии: сервер не может открыть окно на чужой
   машине. В браузере путь вводится вручную. */
body.web .os-only { display: none !important; }
body.web .web-only { display: block !important; }

label.field { display: block; margin-bottom: 11px; }
label.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
label.field > span .req { color: var(--danger); }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  user-select: text;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
.check { display: flex; align-items: flex-start; gap: 9px; padding: 8px 4px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check .body { flex: 1; min-width: 0; }
.check .body .t { font-weight: 500; }
.check .body .d { font-size: 12px; color: var(--muted); word-break: break-all; }
.mut { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty h3 { font-weight: 600; margin: 0 0 6px; color: var(--text); }

.note {
  border-left: 3px solid var(--accent); background: var(--panel-2);
  padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 12.5px; margin: 10px 0;
}
.note.warn { border-color: var(--warn); }
.note.danger { border-color: var(--danger); }

/* ── Нижняя панель ───────────────────────────────────────────────────── */
#foot {
  flex: none; border-top: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column;
}
#bar { display: flex; align-items: center; gap: 12px; padding: 7px 16px; min-height: 38px; }
#bar .stage { font-size: 12px; min-width: 150px; }
#bar .prog { flex: 1; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
#bar .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
#bar .prog.indef i { width: 30%; animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
#bar .counts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#log {
  max-height: 0; overflow-y: auto; transition: max-height .18s;
  font-family: var(--mono); font-size: 11.5px; padding: 0 16px;
  border-top: 1px solid transparent; user-select: text;
}
#log.open { max-height: 190px; padding: 8px 16px; border-top-color: var(--line); }
#log div { padding: 1px 0; }
#log .warn { color: var(--warn); }
#log .error { color: var(--danger); }
#log .info { color: var(--muted); }

/* ── Модальные окна ──────────────────────────────────────────────────── */
#modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: none; align-items: center; justify-content: center; z-index: 50;
  backdrop-filter: blur(2px);
}
#modal-bg.open { display: flex; }
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  width: min(560px, 92vw); max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.modal.wide { width: min(760px, 94vw); }
.modal header { padding: 15px 18px 10px; font-size: 15px; font-weight: 600; }
.modal .body { padding: 0 18px 4px; overflow-y: auto; }
.modal footer {
  padding: 12px 18px 15px; display: flex; gap: 8px; justify-content: flex-end;
  border-top: 1px solid var(--line); margin-top: 12px;
}
.modal footer .left { margin-right: auto; }

.recovery {
  font-family: var(--mono); font-size: 14px; line-height: 1.9; letter-spacing: .5px;
  background: var(--bg); border: 1px solid var(--warn); border-radius: 8px;
  padding: 12px 14px; word-break: break-all; user-select: all; margin: 12px 0;
}
.crumbs { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; margin-bottom: 8px; }
.crumbs button { background: none; border: none; color: var(--accent); padding: 1px 3px; }
.crumbs span { color: var(--muted); }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div id="brand">AutoBak <span class="v" id="ver"></span></div>
    <div class="side-head">Серверы <button id="add-server" title="Добавить сервер">+</button></div>
    <div id="servers"></div>
    <div id="side-foot">
      <button class="side-btn" id="nav-repos">Хранилища</button>
      <button class="side-btn" id="nav-notify">Уведомления</button>
      <button class="side-btn" id="nav-about">О программе</button>
      <!-- Выход есть только в браузере: у окна нет сессии, из которой
           можно выйти. Через fetch со служебным заголовком, а не простой
           формой: иначе страница злоумышленника разлогинивала бы по кругу. -->
      <button class="side-btn web-only" id="logout-btn" style="display:none">Выйти</button>
    </div>
  </aside>

  <main id="main">
    <div id="head">
      <div>
        <h1 id="title">AutoBak</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="spacer"></div>
      <div id="head-actions" class="row"></div>
    </div>
    <div id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

<div id="foot">
  <div id="bar">
    <div class="stage" id="stage">Готов</div>
    <div class="prog" id="prog"><i></i></div>
    <div class="counts" id="counts"></div>
    <button class="btn sm" id="cancel" style="display:none">Отменить</button>
    <button class="btn sm" id="toggle-log">Журнал</button>
  </div>
  <div id="log"></div>
</div>

<div id="modal-bg"><div class="modal" id="modal"></div></div>

<script>
"use strict";

/* ── Мост к ядру ──────────────────────────────────────────────────────
   Страница одна на два варианта запуска. В окне методы ядра проброшены
   мостом Wails; в браузере их нет, и вместо них подставляется прокси,
   превращающий любой вызов в запрос к серверу. Имена методов и их
   аргументы при этом совпадают, поэтому весь остальной код ниже про
   разницу не знает вовсе. */
const webAPI = new Proxy({}, {
  get: (_, name) => (...args) =>
    fetch("/api/" + name, {
      method: "POST",
      // Заголовок обязателен на стороне сервера: форма с чужого сайта
      // его не поставит, а запрос с ним браузер без спроса не отправит.
      headers: { "Content-Type": "application/json", "X-Autobak": "1" },
      body: JSON.stringify(args),
      credentials: "same-origin",
    }).then(async (r) => {
      if (r.status === 401) { location.href = "/login"; throw new Error("сессия истекла"); }
      const text = await r.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) {
        throw new Error(text.slice(0, 300) || r.statusText);
      }
      if (!r.ok) throw new Error((data && data.error) || r.statusText);
      return data;
    }),
});

const isWindowApp = () => !!(window.go && window.go.main && window.go.main.UI);
const go = () => (isWindowApp() ? window.go.main.UI : webAPI);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = { servers: [], repos: [], sel: null, tab: "overview", busy: "", snaps: [], browse: null, platform: "" };

/* ── Журнал и прогресс ───────────────────────────────────────────────── */
function log(level, msg) {
  const el = $("log");
  const d = document.createElement("div");
  d.className = level;
  d.textContent = new Date().toLocaleTimeString() + "  " + msg;
  el.appendChild(d);
  while (el.childElementCount > 500) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
  if (level === "error") el.classList.add("open");
}

$("toggle-log").onclick = () => $("log").classList.toggle("open");
$("cancel").onclick = () => go().Cancel();

function setBusy(what) {
  state.busy = what;
  $("stage").textContent = what || "Готов";
  $("cancel").style.display = what ? "" : "none";
  $("prog").classList.toggle("indef", !!what);
  if (!what) {
    $("prog").querySelector("i").style.width = "0";
    $("counts").textContent = "";
  }
  render();
}

/* ── Загрузка состояния ──────────────────────────────────────────────── */
async function reload() {
  const st = await go().State();
  state.servers = st.servers || [];
  state.repos = st.repos || [];
  state.notify = st.notify || {};
  state.hasTelegramToken = st.has_telegram_token;
  state.hasMailPass = st.has_mail_pass;
  state.platform = st.platform || "";
  $("ver").textContent = st.version;
  if (state.sel && !state.servers.find(s => s.id === state.sel)) state.sel = null;
  if (!state.sel && state.servers.length) state.sel = state.servers[0].id;
  render();
}

const cur = () => state.servers.find(s => s.id === state.sel);

function dotClass(s) {
  if (!s.last_time) return "";
  if (s.status === "ошибка") return "err";
  if (s.status === "с замечаниями") return "warn";
  return "ok";
}

/* ── Отрисовка ───────────────────────────────────────────────────────── */
function render() {
  $("servers").innerHTML = state.servers.map(s => `
    <div class="srv ${s.id === state.sel ? "sel" : ""}" data-id="${s.id}">
      <span class="dot ${dotClass(s)}"></span>
      <span class="n">${esc(s.name)}</span>
      <span class="t">${esc(s.last_time ? s.last_time.slice(0, 5) : "-")}</span>
    </div>`).join("") ||
    `<div class="empty" style="padding:20px 8px;font-size:12px">Серверов пока нет</div>`;

  document.querySelectorAll(".srv").forEach(el =>
    el.onclick = () => { state.sel = el.dataset.id; state.tab = "overview"; state.snaps = []; render(); });

  const s = cur();
  if (state.tab === "repos") return renderRepos();
  if (state.tab === "notify") return renderNotify();
  if (state.tab === "about") return renderAbout();
  if (!s) return renderWelcome();

  $("title").textContent = s.name;
  $("subtitle").innerHTML =
    `${esc(s.address)} · хранилище <b>${esc(s.repo_name || "?")}</b> · ` +
    `${s.mode === "push" ? "сервер пишет сам" : "забирает этот компьютер"}`;

  $("head-actions").innerHTML = `
    <button class="btn primary" id="do-backup" ${state.busy || !s.has_plan ? "disabled" : ""}>Бэкап сейчас</button>
    <button class="btn" id="do-discover" ${state.busy ? "disabled" : ""}>Обследовать</button>`;
  $("do-backup").onclick = doBackup;
  $("do-discover").onclick = doDiscover;

  const tabs = [["overview", "Обзор"], ["plan", "План"], ["snapshots", "Снимки"], ["settings", "Настройки"]];
  $("tabs").innerHTML = tabs.map(([k, t]) =>
    `<button class="tab ${state.tab === k ? "sel" : ""}" data-tab="${k}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach(el =>
    el.onclick = () => { state.tab = el.dataset.tab; render(); if (state.tab === "snapshots") loadSnaps(); });

  ({ overview: renderOverview, plan: renderPlan, snapshots: renderSnaps, settings: renderSettings }
    [state.tab] || renderOverview)(s);
}

function renderWelcome() {
  $("title").textContent = "AutoBak";
  $("subtitle").textContent = "";
  $("head-actions").innerHTML = "";
  $("tabs").innerHTML = "";
  $("view").innerHTML = `
    <div class="empty">
      <h3>Ни одного сервера пока не добавлено</h3>
      <p>Сначала подключите хранилище - туда лягут бэкапы.<br>
         Затем добавьте сервер, и AutoBak сам найдёт на нём сайты, базы и конфигурации.</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn primary" onclick="modalRepo()">Подключить хранилище</button>
        <button class="btn" onclick="modalServer()">Добавить сервер</button>
      </div>
    </div>`;
}

function renderOverview(s) {
  const problem = s.last_error
    ? `<div class="note danger"><b>Последний бэкап не удался.</b><br>${esc(s.last_error)}</div>` : "";
  const partial = s.status === "с замечаниями"
    ? `<div class="note warn">Последний снимок сделан, но часть модулей не отработала.
       Откройте вкладку «Снимки», чтобы увидеть подробности.</div>` : "";
  const noPlan = !s.has_plan
    ? `<div class="note">План бэкапа ещё не составлен. Нажмите «Обследовать» -
       агент найдёт сайты, базы и конфигурации, и вам останется отметить нужное.</div>` : "";

  $("view").innerHTML = `
    ${problem}${partial}${noPlan}
    <div class="card">
      <div class="grid">
        <div class="stat"><div class="k">Состояние</div><div class="v sm">${esc(s.status)}</div></div>
        <div class="stat"><div class="k">Последний бэкап</div><div class="v sm">${esc(s.last_time || "-")}</div></div>
        <div class="stat"><div class="k">Объём</div><div class="v sm">${esc(s.last_bytes || "-")}</div></div>
        <div class="stat"><div class="k">Расписание</div><div class="v sm">${esc(s.schedule)}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Что бэкапится <span class="hint">${s.modules.filter(m => m.enabled).length} из ${s.modules.length} модулей</span></h2>
      ${s.modules.length ? s.modules.filter(m => m.enabled).map(m => `
        <div class="check"><input type="checkbox" checked disabled>
          <div class="body"><div class="t">${esc(m.title)}: ${esc(m.name)}</div>
          <div class="d">${esc(m.detail)}</div></div></div>`).join("")
        : `<div class="mut">План пуст.</div>`}
    </div>
    <div class="card">
      <h2>Хранение <span class="hint">${esc(s.retention)}</span></h2>
      <div class="row">
        <button class="btn" id="do-prune" ${state.busy ? "disabled" : ""}>Проверить, что можно удалить</button>
        <button class="btn" id="do-verify" ${state.busy ? "disabled" : ""}>Проверить целостность</button>
        <button class="btn" id="do-drill" ${state.busy || !s.last_time ? "disabled" : ""}>Проверить восстановлением</button>
      </div>
      <div class="note">«Проверить целостность» отвечает на вопрос «данные целы?».
        «Проверить восстановлением» - на вопрос «а из них получается то же самое?».
        Второе строго сильнее: оно раскладывает выборку на диск и сверяет результат.</div>
    </div>`;
  $("do-prune").onclick = () => doPrune(s);
  $("do-verify").onclick = () => doVerify(s);
  $("do-drill").onclick = () => doDrill(s);
}

async function doDrill(s) {
  $("log").classList.add("open");
  try {
    const r = await go().Drill(s.id, "", 1024);
    await reload();
    const ok = (!r.mismatches || !r.mismatches.length) && (!r.problems || !r.problems.length);
    alertModal(ok ? "Снимок пригоден" : "Снимок непригоден", `
      <p>Снимок <span class="mono">${esc(r.snapshot_id)}</span>:
      восстановлено и сверено файлов <b>${r.files_checked}</b> из ${r.files_in_snapshot}
      (${fmtBytes(r.bytes_checked)}) за ${esc(r.duration)}.</p>
      ${ok
        ? `<div class="note">Данные не просто целы - из них получается ровно то,
           что было записано. Выборка случайная, так что следующая проверка
           возьмёт другие файлы.</div>`
        : `<div class="note danger">
           ${(r.mismatches || []).slice(0, 5).map(esc).join("<br>")}
           ${(r.problems || []).slice(0, 5).map(esc).join("<br>")}</div>`}`);
  } catch (e) { fail(e); }
}

      <div class="row" style="margin-top:12px">

async function loadSnaps() {
  const s = cur(); if (!s) return;
  try { state.snaps = await go().Snapshots(s.id); }
  catch (e) { fail(e); state.snaps = []; }
  if (state.tab === "snapshots") renderSnaps(s);
}

async function doMirror(repoID) {
  const r = state.repos.find(x => x.id === repoID);
  if (!r || !r.mirror_to) return;
  try {
    const dry = await go().Mirror(repoID, r.mirror_to, false, false);
    if (dry.copied === 0) {
      alertModal("Копия уже актуальна",
        `<p>В хранилище «${esc(r.mirror_name)}» уже есть всё: ${dry.skipped} объектов.</p>`);
      await reload();
      return;
    }
    openModal("Копирование во второе хранилище", `
      <p>Из «${esc(r.name)}» в «${esc(r.mirror_name)}».</p>
      <p>Будет скопировано объектов: <b>${dry.copied}</b> (${fmtBytes(dry.bytes)}),
      уже есть: ${dry.skipped}.</p>
      ${(dry.orphans || []).length ? `<div class="note">В копии ${dry.orphans.length}
        объектов, которых больше нет в источнике. Они остаются намеренно:
        копия нужна ровно на случай, когда с источником случилось плохое.</div>` : ""}`, [
      { text: "Отмена", cls: "btn" },
      {
        text: "Скопировать", cls: "btn primary", keep: true, act: async () => {
          try {

  alertModal("Не получилось", msg);

      <div class="grid">

        <div class="stat"><div class="k">Прочитано</div><div class="v sm">${esc(r.total)}</div></div>
        <div class="stat"><div class="k">Новых данных</div><div class="v sm">${esc(r.new)}</div></div>

async function doDiscover(applyPlan) {
  const s = cur(); if (!s) return;
  try {
    const rep = await go().Discover(s.id);
    const sites = (rep.sites || []).map(x =>
      `<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.root)}</td>
       <td>${esc(x.php || "")}</td><td class="num">${fmtBytes(x.size)}</td>
       <td>${esc((x.databases || []).join(", "))}</td></tr>`).join("");
    const dbs = ((rep.mysql || {}).databases || []).map(d =>
      `<tr><td>${esc(d.name)}</td><td class="num">${fmtBytes(d.size)}</td><td>${esc(d.owner || "")}</td></tr>`).join("");

    let body = `<p>${esc(rep.os)}${rep.panel ? " · " + esc(rep.panel.kind + " " + (rep.panel.version || "")) : ""}</p>`;
    if (sites) body += `<h2 style="font-size:13px;margin:14px 0 6px">Сайты</h2>
      <table><thead><tr><th>Домен</th><th>Каталог</th><th>PHP</th><th class="num">Размер</th><th>Базы</th></tr></thead>
      <tbody>${sites}</tbody></table>`;
    if (dbs) body += `<h2 style="font-size:13px;margin:14px 0 6px">Базы MySQL</h2>
      <table><thead><tr><th>База</th><th class="num">Размер</th><th>Владелец</th></tr></thead><tbody>${dbs}</tbody></table>`;
    if (rep.docker && rep.docker.version) body +=
      `<p style="margin-top:12px">Docker ${esc(rep.docker.version)}: контейнеров
       ${(rep.docker.containers || []).length}, томов ${(rep.docker.volumes || []).length}</p>`;
    if (rep.configs && rep.configs.length) body +=
      `<p class="mut" style="font-size:12px">Конфигурации: ${esc(rep.configs.join(", "))}</p>`;
    (rep.warnings || []).forEach(w => body += `<div class="note warn">${esc(w)}</div>`);

    openModal("Что нашлось на сервере", body + `
      <div class="note">Первый бэкап передаст примерно <b>${fmtBytes(estimate(rep))}</b>.
      Дальнейшие будут в десятки раз меньше.</div>`, [
      { text: "Закрыть", cls: "btn" },
      {
        text: "Составить план по найденному", cls: "btn primary", keep: true, act: async () => {
          try {
            const p = await go().SuggestPlan(s.id);
            await go().SavePlan(s.id, p);
            closeModal(); await reload(); state.tab = "plan"; render();
            log("info", "план составлен по результатам обследования");
          } catch (e) { fail(e); }
        }
      }]);
  } catch (e) { fail(e); }
}

function estimate(rep) {
  let t = 0;
  (rep.sites || []).forEach(x => t += x.size || 0);
  ((rep.mysql || {}).databases || []).forEach(d => t += d.size || 0);
  ((rep.postgres || {}).databases || []).forEach(d => t += d.size || 0);
  ((rep.docker || {}).volumes || []).forEach(v => t += v.size || 0);
  return t;
}

function fmtBytes(n) {
  if (!n) return "-";
  const u = ["Б", "КБ", "МБ", "ГБ", "ТБ"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}

function restoreReq(s, snapID, include) {
  const server = $("r-dest").value === "server";
  return {
    server_id: s.id, snapshot_id: snapID, include,
    to_server: server, local_dir: server ? "" : $("r-dir").value.trim(),
    overwrite: server ? $("r-over").checked : false,
    db_mode: server ? $("r-db").value : "file",
    db_in_place: server && $("r-db").value === "restore" && $("r-inplace").checked,
    confirm: "",
  };
}

async function previewRestore(s, snapID, include) {
  const req = restoreReq(s, snapID, include);
  try {
    const rep = await go().RestorePreview(req);
    const danger = req.to_server || req.overwrite || req.db_in_place;
    const over = (rep.overwrites || []).length;
    $("r-preview").innerHTML = `
      <div class="note ${danger ? "warn" : ""}">
        <b>Будет восстановлено:</b> файлов ${rep.files}, каталогов ${rep.dirs}, ${fmtBytes(rep.bytes)}.
        ${(rep.databases || []).length ? `<br>Базы: ${rep.databases.map(esc).join(", ")}` : ""}
        ${over ? `<br><b>Будет перезаписано файлов: ${over}</b>` : ""}
        ${rep.overwrite_unknown ? `<br><b>Восстановление на сервер:</b> какие файлы будут
          перезаписаны, заранее не показать - предпросмотр не видит содержимое сервера.
          Существующие файлы по совпадающим путям будут заменены.` : ""}
        ${(rep.problems || []).length ? `<br>Замечания: ${rep.problems.slice(0, 3).map(esc).join("; ")}` : ""}
      </div>
      ${req.db_in_place ? `<div class="note danger">Боевые базы будут заменены безвозвратно.</div>` : ""}
      ${danger ? `<label class="field"><span>Наберите имя сервера для подтверждения:
        <b>${esc(s.name)}</b></span><input type="text" id="confirm-input" autocomplete="off"></label>` : ""}`;

    setFooter([
      { text: "Отмена", cls: "btn" },
      {
        text: danger ? "Восстановить" : "Скачать", cls: danger ? "btn danger" : "btn primary",
        keep: true, act: async () => {
          const r2 = restoreReq(s, snapID, include);
          const ci = $("confirm-input");
          r2.confirm = ci ? ci.value.trim() : "";
          try {
            const done = await go().RestoreApply(r2);
            closeModal();
            alertModal("Восстановление завершено", `<p>${esc(done.files)} файлов,
              ${fmtBytes(done.bytes)}${done.databases && done.databases.length
                ? ", баз: " + done.databases.length : ""}.</p>`);
          } catch (e) { fail(e); }
        }
      }]);
  } catch (e) { fail(e); }
}

      text: "Закрыть", cls: "btn primary", keep: true, act: () => {
        if (!$("rec-ok").checked) return;
        closeModal();
      }
    }]);
}

function modalServer() {
  if (!state.repos.length) {
    return alertModal("Сначала хранилище",
      "<p>Прежде чем добавлять сервер, подключите хранилище - иначе бэкапам будет некуда лечь.</p>");
  }
  openModal("Добавить сервер", `
    <label class="field"><span>Название <span class="req">*</span></span>
      <input type="text" id="sv-name" placeholder="prod"></label>
    <div class="row">
      <label class="field" style="flex:2"><span>Адрес <span class="req">*</span></span>
        <input type="text" id="sv-host" placeholder="203.0.113.10 или server.example.com"></label>
      <label class="field" style="width:100px"><span>Порт</span>
        <input type="number" id="sv-port" value="22"></label>
    </div>
    <div class="row">
      <label class="field" style="flex:1"><span>Пользователь</span>
        <input type="text" id="sv-user" value="root"></label>
      <label class="field" style="flex:2"><span>Ключ SSH <span class="mut">(пусто - как настроено в ssh)</span></span>
        <input type="text" id="sv-key" placeholder="C:\\Users\\...\\.ssh\\id_ed25519"></label>
    </div>
    <label class="field"><span>Или запись из ~/.ssh/config</span>
      <input type="text" id="sv-alias" placeholder="prod-web"></label>
    <label class="field"><span>Хранилище</span>
      <select id="sv-repo">${state.repos.map(r =>
        `<option value="${esc(r.id)}">${esc(r.name)} - ${esc(r.location)}</option>`).join("")}</select></label>
    <label class="check"><input type="checkbox" id="sv-sudo">
      <div class="body"><div class="t">Запускать агента через sudo</div>
      <div class="d">Нужно, если вход выполняется не под root.</div></div></label>`, [
    { text: "Отмена", cls: "btn" },
    {
      text: "Добавить", cls: "btn primary", keep: true, act: async () => {
        try {
          await go().AddServer({
            name: $("sv-name").value.trim(), host: $("sv-host").value.trim(),
            alias: $("sv-alias").value.trim(), port: +$("sv-port").value,
            user: $("sv-user").value.trim(), key: $("sv-key").value.trim(),
            repo_id: $("sv-repo").value, mode: "pull", sudo: $("sv-sudo").checked,
          });
          closeModal(); await reload();
          state.sel = state.servers[state.servers.length - 1].id;
          render();
          checkAgent();
        } catch (e) { fail(e); }
      }
    }]);
}

async function checkAgent() {
  const s = cur(); if (!s) return;
  try {
    const v = await go().CheckServer(s.id);
    log("info", s.name + ": " + v);
    alertModal("Связь есть", `<p>На сервере установлен <span class="mono">${esc(v)}</span>.</p>
      <p>Можно нажимать «Обследовать» - программа найдёт, что бэкапить.</p>`);
  } catch (e) {
    openModal("Агент не отвечает", `
      <div class="note warn">${esc((e && e.message) || e)}</div>
      <p>Скорее всего, агент ещё не установлен. Укажите файл
        <span class="mono">autobak-agent</span>, собранный для Linux - программа зальёт его на сервер.</p>
      ${isWindowApp() ? "" : `<label>Путь к файлу на машине с autobak
        <input type="text" id="agent-path" placeholder="/opt/autobak/autobak-agent"></label>`}`, [
      { text: "Позже", cls: "btn" },
      {
        text: isWindowApp() ? "Выбрать файл и установить" : "Установить", cls: "btn primary", keep: true, act: async () => {
          try {
            const f = isWindowApp()
              ? await go().PickFile("Выберите autobak-agent для Linux")
              : ($("agent-path") || {}).value.trim();
            if (!f) return;
            const v = await go().InstallAgent(cur().id, f);
            closeModal();
            const line = await go().AuthorizedKeyLine(cur().id, "ssh-ed25519 AAAA... ваш-ключ", true);
            alertModal("Агент установлен", `<p><span class="mono">${esc(v)}</span></p>
              <p>Теперь ограничьте ключ на сервере - добавьте в
              <span class="mono">~/.ssh/authorized_keys</span> строку вида:</p>
              <div class="recovery" style="border-color:var(--line);font-size:12px">${esc(line)}</div>
              <p class="mut">Так ключ сможет только делать бэкапы. Восстановление им запрещено
              намеренно: команда восстановления пишет произвольные файлы от root, то есть
              ключ с её разрешением равносилен root. На время восстановления уберите
              из строки <span class="mono">--backup-only</span>.</p>`);
          } catch (e2) { fail(e2); }
        }
      }]);
  }
}

/* ── Модальные окна ──────────────────────────────────────────────────── */
let modalActions = [];

function openModal(title, body, actions, cls) {
  modalActions = actions || [{ text: "Закрыть", cls: "btn" }];
  $("modal").className = "modal" + (cls ? " " + cls : "");
  $("modal").innerHTML =
    `<header>${esc(title)}</header><div class="body">${body}</div><footer id="modal-foot"></footer>`;
  setFooter(modalActions);
  $("modal-bg").classList.add("open");
}

function setFooter(actions) {
  const f = $("modal-foot");
  f.innerHTML = actions.map((a, i) => `<button class="${a.cls}" data-a="${i}">${esc(a.text)}</button>`).join("");
  f.querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = actions[+b.dataset.a];
    if (a.act) a.act();
    if (!a.keep) closeModal();
  });
}

function closeModal() { $("modal-bg").classList.remove("open"); }
function alertModal(title, body) { openModal(title, body, [{ text: "Понятно", cls: "btn primary" }]); }

function confirmName(kind, name, why) {
  return new Promise(resolve => {
    openModal("Подтвердите действие", `
      <div class="note danger">${esc(why)}</div>
      <label class="field"><span>Наберите имя ${esc(kind)}: <b>${esc(name)}</b></span>
        <input type="text" id="confirm-input" autocomplete="off"></label>`, [
      { text: "Отмена", cls: "btn", act: () => resolve(false) },
      {
        text: "Подтвердить", cls: "btn danger", keep: true, act: () => {
          if ($("confirm-input").value.trim() !== name) return;
          closeModal(); resolve(true);
        }
      }]);
  });
}

$("modal-bg").onclick = (e) => { if (e.target === $("modal-bg")) closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ── Запуск ──────────────────────────────────────────────────────────── */
$("add-server").onclick = modalServer;
$("nav-repos").onclick = () => { state.tab = "repos"; state.sel = null; render(); };
$("nav-notify").onclick = () => { state.tab = "notify"; state.sel = null; render(); };
$("nav-about").onclick = () => { state.tab = "about"; state.sel = null; render(); };

/* Обработчики событий ядра. Источник у них разный - мост окна или поток
   от сервера, - но сами события одинаковые, поэтому разбор один. */
const handlers = {
  log: (l) => log(l.level, l.msg),
  busy: setBusy,
  progress: (p) => {
    $("stage").textContent = p.stage || state.busy || "";
    const c = [];
    if (p.files) c.push(p.files.toLocaleString("ru") + " файлов");
    if (p.bytes) c.push(fmtBytes(p.bytes));
    $("counts").textContent = c.join(" · ");
    if (p.bytes_total > 0) {
      $("prog").classList.remove("indef");
      $("prog").querySelector("i").style.width =
        Math.min(100, (p.bytes / p.bytes_total) * 100) + "%";
    }
  },
};

/* В браузере события приходят потоком от сервера. Он же переживает
   разрыв связи: браузер переподключается сам, а если сессия к тому
   моменту истекла, страница уходит на вход, а не молча замирает без
   обновлений. */
function subscribeWeb() {
  let src = null, gone = false;
  const open = () => {
    src = new EventSource("/api/events");
    src.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch (_) { return; }
      const h = handlers[m.name];
      if (h) h(m.data);
    };
    src.onerror = () => {
      src.close();
      if (gone) return;
      // Проверяем, жива ли ещё сессия: без этого страница бесконечно
      // стучится в закрытую дверь и выглядит просто зависшей.
      fetch("/api/events", { method: "HEAD", credentials: "same-origin" })
        .then((r) => { if (r.status === 401) { gone = true; location.href = "/login"; return; } setTimeout(open, 2000); })
        .catch(() => setTimeout(open, 2000));
    };
  };
  open();
}

window.addEventListener("DOMContentLoaded", () => {
  if (!isWindowApp()) {
    document.body.classList.add("web");
    const lo = $("logout-btn");
    if (lo) lo.onclick = () => {
      fetch("/logout", { method: "POST", headers: { "X-Autobak": "1" }, credentials: "same-origin" })
        .finally(() => { location.href = "/login"; });
    };
  }
  if (isWindowApp() && window.runtime) {
    for (const [name, fn] of Object.entries(handlers)) window.runtime.EventsOn(name, fn);
  } else if (!isWindowApp()) {
    subscribeWeb();
  }
  reload().catch(e => log("error", String(e)));
});
</script>
