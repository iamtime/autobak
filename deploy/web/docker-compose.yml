# Веб-интерфейс AutoBak на выделенной машине для бэкапов.
#
#   1. Задайте пароль в .env рядом с этим файлом:
#        AUTOBAK_PASSWORD=длинный-пароль
#   2. docker compose up -d
#   3. В журнале (docker compose logs) будет публичный ключ SSH -
#      разложите его по серверам, которые собираетесь бэкапить.
#   4. Откройте http://<адрес>:8080
#
# Порт по умолчанию опубликован только на localhost. Наружу его выставляйте
# осознанно и только за обратным прокси с TLS: через этот интерфейс идёт
# восстановление на любой подключённый сервер.

services:
  autobak-web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        VERSION: dev
        # Для ARM-машины поменяйте на arm64.
        TARGETARCH: amd64
    image: autobak-web:local
    container_name: autobak-web
    restart: unless-stopped

    environment:
      # Пароль берётся из .env и не попадает ни в этот файл, ни в историю
      # команд. Без него сервер создаст временный и напечатает в журнал.
      AUTOBAK_USER: "${AUTOBAK_USER:-admin}"
      AUTOBAK_PASSWORD: "${AUTOBAK_PASSWORD:?задайте AUTOBAK_PASSWORD в .env}"
      TZ: "${TZ:-Europe/Moscow}"

      # Свой сертификат, если не ставите обратный прокси. Файлы положите
      # в ./tls и раскомментируйте том ниже.
      # AUTOBAK_TLS_CERT: /tls/fullchain.pem
      # AUTOBAK_TLS_KEY: /tls/privkey.pem

    ports:
      # Только петля: контейнер слушает 0.0.0.0 внутри себя, а решение
      # пускать ли в него из сети принимается здесь. Для доступа снаружи
      # поставьте перед ним nginx или Caddy с сертификатом.
      - "127.0.0.1:8080:8080"

    volumes:
      # Всё состояние: настройки, ключи от репозиториев, ключ SSH.
      # Потеряете этот том - потеряете доступ к сделанным бэкапам.
      # Его самого тоже стоит куда-нибудь копировать.
      - autobak-data:/var/lib/autobak

      # Локальное хранилище бэкапов, если храните их на этой же машине,
      # а не в S3. Путь внутри указывайте при создании хранилища.
      - ./backups:/backups

      # - ./tls:/tls:ro

    # Ограничения на всякий случай: восстановление большого снимка
    # съедает память под буферы, и лучше пусть упрётся в предел, чем
    # выдавит с машины что-то ещё.
    deploy:
      resources:
        limits:
          memory: 2G

    security_opt:
      - no-new-privileges:true

volumes:
  autobak-data:
