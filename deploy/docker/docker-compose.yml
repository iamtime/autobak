# AutoBak на сервере одним файлом.
#
#   1. Положите рядом autobak-agent-linux-amd64 (из dist), Dockerfile и
#      entrypoint.sh
#   2. Получите config.json и key командой на компьютере:
#        autobak agent-config <сервер>
#      и положите оба файла в ./autobak
#   3. chmod 700 ./autobak && chmod 600 ./autobak/*
#   4. docker compose up -d
#
# Дальше контейнер сам просыпается по расписанию и пишет в S3.
# Компьютер для этого включать не нужно.

services:
  autobak:
    build:
      context: .
      args:
        # Для ARM-сервера поменяйте на arm64 и положите рядом
        # autobak-agent-linux-arm64.
        TARGETARCH: amd64
    image: autobak-agent:local
    container_name: autobak
    restart: unless-stopped

    # Сеть хоста нужна, чтобы достучаться до баз по localhost и по тем же
    # сокетам, что и приложения. Без неё пришлось бы открывать MySQL наружу,
    # то есть ухудшать безопасность сервера ради бэкапов.
    network_mode: host

    environment:
      AUTOBAK_AT: "04:00"        # время ежедневного запуска
      AUTOBAK_JITTER: "1800"     # разброс в секундах
      AUTOBAK_RUN_NOW: "0"       # 1 - сделать первый бэкап сразу после старта
      TZ: "Europe/Moscow"

      # Нужно только при запуске с Docker Desktop на Windows или macOS.
      # Там смонтированный каталог приезжает с правами 0755 независимо от
      # того, что стоит на хосте, и chmod внутри контейнера на него не
      # действует. Агент такие файлы читать отказывается - в них ключ от
      # хранилища. Переключатель переносит конфигурацию в приватный каталог
      # внутри контейнера; за права на хостовый каталог отвечаете вы.
      #
      # На Linux-сервере (то есть в бою) оставьте 0: там права передаются
      # как есть, и проверка работает как задумано.
      AUTOBAK_PRIVATE_COPY: "0"

    volumes:
      # Конфигурация и ключ репозитория. Единственное, что нужно принести.
      - ./autobak:/etc/autobak

      # Данные, которые бэкапим. Пути внутри контейнера совпадают с путями
      # на хосте намеренно: план бэкапа написан в терминах хоста, и любое
      # переименование означало бы, что восстановление промахнётся мимо цели.
      #
      # Всё только на чтение: агенту незачем уметь писать в ваши сайты.
      - /home:/home:ro
      - /var/www:/var/www:ro
      - /srv:/srv:ro
      - /etc:/etc:ro
      - /usr/local/hestia:/usr/local/hestia:ro

      # Тома docker: сборщик читает их напрямую из каталога драйвера local.
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # Сокет docker: нужен, чтобы узнать список томов, стеков и контейнеров.
      # Доступ к сокету равносилен правам root на хосте - если docker вам
      # не нужен, уберите обе строки и выключите модуль в плане.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Сокет MySQL/MariaDB: подключение без пароля и без сети.
      - /var/run/mysqld:/var/run/mysqld:ro
      # Сокет PostgreSQL.
      - /var/run/postgresql:/var/run/postgresql:ro

    # Агент читает чужие файлы, поэтому работает от root. Всё остальное
    # ему запрещено: писать он может только в хранилище, и то по сети.
    user: root
    cap_drop:
      - ALL
    cap_add:
      # Чтение любых файлов независимо от прав. Именно это и нужно
      # для бэкапа, и ничего сверх.
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
